name: Android build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

# Each PR needs only its newest commit verified. Cancelling superseded emulator
# runs prevents stale commits from occupying the hosted runner for 20+ minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  assemble:
    # Pin a stable hosted image; ubuntu-latest moved to Ubuntu 26.04 and
    # the Android 35 emulator failed to finish booting on that image.
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go for DNSTT mobile binding
        uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
          cache: false

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0 ndk;27.2.12479018

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Generate and verify Gradle wrapper
        run: |
          gradle wrapper --gradle-version 8.13 --distribution-type bin
          chmod +x gradlew
          ./gradlew --version

      - name: Build pinned DNSTT Android AAR
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/27.2.12479018"
          export ANDROID_NDK_ROOT="$ANDROID_NDK_HOME"
          chmod +x scripts/build-dnstt-android-aar.sh
          scripts/build-dnstt-android-aar.sh

      - name: Upload DNSTT Android AAR
        uses: actions/upload-artifact@v4
        with:
          name: dns-sniperx-dnstt-android-aar
          path: app/build/dnstt/dnstt.aar
          if-no-files-found: error
          retention-days: 14

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest

      - name: Run Android instrumentation and UI E2E tests
        uses: reactivecircus/android-emulator-runner@v2
        env:
          # GitHub-hosted runners may not expose nested KVM. Explicitly allow
          # the emulator's supported TCG software-acceleration fallback.
          ANDROID_I_WANT_MY_TCG: "yes"
        with:
          # Use the lighter API 34 / Pixel 2 image for more reliable TCG runs.
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot -wipe-data
          emulator-boot-timeout: 1200
          # Keep the action's software-acceleration mode; TCG is enabled above.
          disable-linux-hardware-acceleration: true
          # Reduce emulator load during instrumentation startup.
          disable-animations: true
          # The action waits for sys.boot_completed before running this command.
          script: ./gradlew connectedDebugAndroidTest

      - name: Upload Android instrumentation and E2E reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dns-sniperx-android-test-reports
          path: |
            app/build/reports/androidTests/connected/debug/**
            app/build/outputs/androidTest-results/connected/debug/**
          if-no-files-found: warn
          retention-days: 14

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: dns-sniperx-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload generated Gradle wrapper
        uses: actions/upload-artifact@v4
        with:
          name: dns-sniperx-gradle-wrapper
          path: |
            gradlew
            gradlew.bat
            gradle/wrapper/gradle-wrapper.jar
            gradle/wrapper/gradle-wrapper.properties
          if-no-files-found: error
          retention-days: 7

      # Commit the wrapper only after the build and tests above have succeeded.
      # The follow-up push triggers CI again, which verifies the checked-in files.
      - name: Commit verified Gradle wrapper
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          python3 - <<'PY'
          from pathlib import Path
          roadmap = Path("docs/ROADMAP.md")
          content = roadmap.read_text()
          content = content.replace(
              "- [ ] Add and verify the Gradle wrapper.",
              "- [x] Add and verify the Gradle wrapper."
          )
          roadmap.write_text(content)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gradlew gradlew.bat gradle/wrapper/gradle-wrapper.jar gradle/wrapper/gradle-wrapper.properties docs/ROADMAP.md
          if ! git diff --cached --quiet; then
            git commit -m "Add verified Gradle wrapper to repository"
            git push
          fi
